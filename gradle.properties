# -Xmx6g (was 4g): the Kotlin/Native release framework link (whole-program
# optimization over all of commonMain+iosMain) OOMs at 4g on the iOS archive
# — the Debug link and JVM/Android builds fit well under it.
org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8
# The JVM/Android compiles run in the Kotlin daemon, whose heap is not
# org.gradle.jvmargs. The Kotlin/Native link never uses it: by default it
# runs inside the Gradle daemon, sharing that heap with Gradle's own state,
# which is why the iOS run-script (iosApp.xcodeproj) moves it to its own
# JVM with kotlin.native.disableCompilerDaemon and kotlin.native.jvmArgs.
kotlin.daemon.jvmargs=-Xmx6g
# Incremental Kotlin/Native (Beta in Kotlin 2.4): linking a debug iOS
# binary keeps per-file compiler caches, so a rebuild in Xcode relinks
# only what changed. It does not touch the klib compile (timed the same).
kotlin.incremental.native=true
org.gradle.parallel=true
org.gradle.tooling.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# Isolated Projects stays off: Compose's plugin reads the root project's
# layout when it packages the Windows MSI, which Isolated Projects refuses
# (the 1.8.1-rc31 release failed to configure on Windows). Linux and the
# other tasks were clean, and it saved 4 s of a 16 s reconfigure.
android.useAndroidX=true
kotlin.code.style=official
# KSP2. KSP1 only passes a processor's direct klib deps to the
# Kotlin/Native compiler, so Room's iOS codegen fails with
# "KLIB resolver: Could not find room-common ... klib" (room-runtime's
# transitive dep). KSP2 resolves the full klib closure; Room 2.7's KMP
# path assumes it. Harmless on JVM/Android (verified those still build).
ksp.useKSP2=true
android.nonTransitiveRClass=true
android.enableR8.fullMode=true


# The app version, in one place because two modules and CI all need it:
# :composeApp bakes it into TalonBuild and the desktop package,
# :androidApp uses it for versionCode/versionName, and release.yml
# reads it to name artifacts. It lived in composeApp/build.gradle.kts
# until the Android application moved to its own module.
talon.versionCode=499
talon.versionName=1.8.12
