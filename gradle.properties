# -Xmx6g (was 4g): the Kotlin/Native release framework link (whole-program
# optimization over all of commonMain+iosMain) OOMs at 4g on the iOS archive
# — the Debug link and JVM/Android builds fit well under it.
org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8
# When the framework compiles via xcodebuild's run-script phase (nomac /
# TestFlight archive), the Kotlin/Native compile runs in the Kotlin daemon,
# whose heap is NOT org.gradle.jvmargs — it needs its own -Xmx or it OOMs
# even though a plain `./gradlew linkRelease...` (Gradle daemon) fits in 6g.
kotlin.daemon.jvmargs=-Xmx6g
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official
# KSP2. KSP1 only passes a processor's direct klib deps to the
# Kotlin/Native compiler, so Room's iOS codegen fails with
# "KLIB resolver: Could not find room-common ... klib" (room-runtime's
# transitive dep). KSP2 resolves the full klib closure; Room 2.7's KMP
# path assumes it. Harmless on JVM/Android (verified those still build).
ksp.useKSP2=true
android.nonTransitiveRClass=true
android.enableR8.fullMode=true

# AGP 9 dropped com.android.application × KMP-plugin compat; bypass until
# the com.android.kotlin.multiplatform.library migration is done.
android.builtInKotlin=false
android.newDsl=false
