name: release

on:
  push:
    tags:
      - 'v*'

# Default to read-only for every job. Only the `release` job below
# re-escalates to contents: write so it can publish the GitHub
# Release — build-android holds the signing keystore and must not
# carry a write token it never uses.
permissions:
  contents: read

jobs:
  # Single source of truth for the tag-vs-versionName check, so the
  # downstream jobs don't each re-parse build.gradle.kts. Outputs the
  # parsed version_name / version_code for steps that need them.
  tagcheck:
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.parse.outputs.version_name }}
      version_code: ${{ steps.parse.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4
      - id: parse
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          # The version lives in gradle.properties now, because two
          # modules and this workflow all need it: :composeApp bakes it
          # into TalonBuild and the desktop package, :androidApp uses it
          # for versionCode/versionName. That also retires the old regex
          # over build.gradle.kts, which had to skip the defaultConfig
          # assignments (they reference the vals and hold no literal) —
          # a bug that once masqueraded as a tag mismatch on v0.7.24.
          VERSION_CODE=$(grep -E '^talon\.versionCode=' gradle.properties | head -1 | cut -d= -f2 | tr -d ' ')
          VERSION_NAME=$(grep -E '^talon\.versionName=' gradle.properties | head -1 | cut -d= -f2 | tr -d ' ')
          if [ "$TAG" != "$VERSION_NAME" ]; then
            echo "::error::Tag (v$TAG) does not match talon.versionName ($VERSION_NAME) in gradle.properties"
            exit 1
          fi
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT

  # Android APK build + sign. Conditional on the four signing secrets
  # being set on the repo. When they're absent (e.g. desktop-only
  # release flows, fresh forks), the job runs to completion but emits
  # no APK artifact and the release publishes desktop installers only.
  build-android:
    needs: tagcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check keystore secret presence
        id: chk
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::RELEASE_KEYSTORE_BASE64 not set — skipping Android APK build"
            echo "have_keystore=false" >> $GITHUB_OUTPUT
          else
            echo "have_keystore=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up JDK 17
        if: steps.chk.outputs.have_keystore == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # core-ktx 1.19.0 / lifecycle 2.11.0 need compileSdk 37, which the
      # runner image may not preinstall. Try the plain id first, fall back
      # to the minor-versioned id (Android's newer platforms;android-37.x
      # scheme) so this works whichever the runner's sdkmanager expects.
      - name: Install Android SDK 37
        if: steps.chk.outputs.have_keystore == 'true'
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-37" 2>/dev/null \
            || "$SDKMGR" "platforms;android-37.0"

      - name: Decode keystore
        if: steps.chk.outputs.have_keystore == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          : "${STORE_PASSWORD:?RELEASE_STORE_PASSWORD secret is not set}"
          : "${KEY_ALIAS:?RELEASE_KEY_ALIAS secret is not set}"
          : "${KEY_PASSWORD:?RELEASE_KEY_PASSWORD secret is not set}"
          umask 077
          mkdir -p ~/.config/talon
          echo "$KEYSTORE_BASE64" | base64 -d > ~/.config/talon/release.keystore
          {
            echo "storeFile=$HOME/.config/talon/release.keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > ~/.config/talon/keystore.properties

      - name: Build release APK
        if: steps.chk.outputs.have_keystore == 'true'
        env:
          RELEASE_KEYSTORE_PROPS: /home/runner/.config/talon/keystore.properties
          # Baked into TalonBuild. Unset secrets arrive as "", which is
          # the same as not shipping a default at all — the ship keeps
          # whatever it was configured with.
          TALON_DEFAULT_ICE: ${{ secrets.TALON_DEFAULT_ICE }}
          TALON_DEFAULT_SFU_BASE: ${{ secrets.TALON_DEFAULT_SFU_BASE }}
          TALON_DEFAULT_SFU_GROUP: ${{ secrets.TALON_DEFAULT_SFU_GROUP }}
          TALON_DEFAULT_SFU_KEY: ${{ secrets.TALON_DEFAULT_SFU_KEY }}
        run: ./gradlew :androidApp:assembleRelease

      - name: Stage release artifacts
        if: steps.chk.outputs.have_keystore == 'true'
        id: stage
        env:
          VERSION_CODE: ${{ needs.tagcheck.outputs.version_code }}
          VERSION_NAME: ${{ needs.tagcheck.outputs.version_name }}
        run: |
          set -euo pipefail
          # ABI splits produce four APKs: arm64-v8a, armeabi-v7a,
          # x86_64, and a universal fallback. The in-app updater
          # consumes a single URL from latest.json, so the universal
          # APK is published as talon-$VERSION_NAME.apk (the name
          # the manifest template hardcodes). The per-arch splits
          # ride along under suffixed names for users who want a
          # smaller manual download.
          # :androidApp, not :composeApp — the Android application
          # moved to its own module so :composeApp could become a
          # KMP library (AGP 10 drops the old pairing).
          APK_DIR=androidApp/build/outputs/apk/release
          UNIVERSAL="$APK_DIR/androidApp-universal-release.apk"
          if [ ! -f "$UNIVERSAL" ]; then
            echo "::error::universal APK not found at $UNIVERSAL"
            ls -la "$APK_DIR"
            exit 1
          fi
          OUT_APK="talon-$VERSION_NAME.apk"
          cp "$UNIVERSAL" "$OUT_APK"
          STAGED=("$OUT_APK")
          # Each split's URL and hash, so a device downloads the APK
          # for its own architecture rather than the universal one,
          # which is several times the size.
          ANDROID='{}'
          BASE="https://github.com/nisfeb/talon/releases/download/v$VERSION_NAME"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            SRC="$APK_DIR/androidApp-$abi-release.apk"
            if [ -f "$SRC" ]; then
              DEST="talon-$VERSION_NAME-$abi.apk"
              cp "$SRC" "$DEST"
              STAGED+=("$DEST")
              ANDROID=$(jq --arg k "$abi" --arg url "$BASE/$DEST" \
                --arg sha "$(sha256sum "$DEST" | awk '{print $1}')" \
                '.[$k] = {url: $url, sha256: $sha}' <<<"$ANDROID")
            else
              echo "::warning::missing split APK for $abi at $SRC"
            fi
          done
          SHA=$(sha256sum "$OUT_APK" | awk '{print $1}')
          # Build latest.json with jq instead of sed. The previous
          # sed pipeline used `|` as substitution delimiter and choked
          # on commit messages containing `|` (caught real on
          # 0.9.0-rc1: `(list | chat | thread visible at once)`).
          # Triple-escaping `\` / `"` / `&` / `|` through two cascaded
          # sed runs is also fragile. jq knows how to escape JSON
          # strings; let it do that job. (The old
          # release/manifest-template.json skeleton is gone — this jq
          # invocation is the manifest's single source of truth.)
          CHANGELOG="$(git log -1 --pretty=%B | tr '\n' ' ')"
          jq -n \
              --argjson versionCode "$VERSION_CODE" \
              --arg     versionName "$VERSION_NAME" \
              --arg     sha         "$SHA" \
              --arg     changelog   "$CHANGELOG" \
              --argjson android     "$ANDROID" \
              '{
                versionCode: $versionCode,
                versionName: $versionName,
                url: ("https://github.com/nisfeb/talon/releases/download/v"
                      + $versionName + "/talon-" + $versionName + ".apk"),
                sha256: $sha,
                minSdk: 26,
                changelog: $changelog,
                mandatory: false,
                android: $android
              }' > latest.json
          # Newline-separated list of staged paths for the upload step.
          printf '%s\n' "${STAGED[@]}" > staged-apks.txt
          echo "apks_file=staged-apks.txt" >> $GITHUB_OUTPUT

      - name: Upload Android APKs + manifest
        if: steps.chk.outputs.have_keystore == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            talon-*.apk
            latest.json
          if-no-files-found: error

  # Desktop matrix runs jpackage on each host OS so the per-platform
  # installer toolchains are present (dpkg + fakeroot on Linux,
  # hdiutil on macOS, WiX on Windows). Independent of build-android so
  # the desktop pipeline ships even without Android signing secrets.
  build-desktop:
    needs: tagcheck
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: packageReleaseDeb
            artifact_glob: composeApp/build/compose/binaries/main-release/deb/*.deb
            artifact_name: linux-deb
          - os: macos-latest
            target: packageReleaseDmg
            artifact_glob: composeApp/build/compose/binaries/main-release/dmg/*.dmg
            artifact_name: macos-dmg
          - os: windows-latest
            target: packageReleaseMsi
            artifact_glob: composeApp/build/compose/binaries/main-release/msi/*.msi
            artifact_name: windows-msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      # macOS-only: generate icon.icns from icon.png so the .app
      # bundle / .dmg / Dock-after-install all get the Talon logo
      # instead of jpackage's default. The .icns isn't committed; the
      # script no-ops on non-mac runners.
      - name: Generate macOS icon
        if: runner.os == 'macOS'
        run: ./scripts/build-macos-icns.sh
        shell: bash
      - name: Build native package (${{ matrix.target }})
        env:
          TALON_DEFAULT_ICE: ${{ secrets.TALON_DEFAULT_ICE }}
          TALON_DEFAULT_SFU_BASE: ${{ secrets.TALON_DEFAULT_SFU_BASE }}
          TALON_DEFAULT_SFU_GROUP: ${{ secrets.TALON_DEFAULT_SFU_GROUP }}
          TALON_DEFAULT_SFU_KEY: ${{ secrets.TALON_DEFAULT_SFU_KEY }}
        run: ./gradlew :composeApp:${{ matrix.target }}
        shell: bash
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

      # AppImage piggybacks on the Linux deb job so we don't pay for a
      # second runner. The script invokes :createReleaseDistributable
      # itself — packageReleaseDeb produces the deb directly without
      # leaving the bundled-app dir behind, so we have to (re)build
      # the app-image. The second gradle invocation is mostly cache
      # hits since compileKotlinDesktop is up to date.
      # appimagetool itself is invoked with --appimage-extract-and-run
      # so this runner doesn't need FUSE.
      - name: Build AppImage (Linux only)
        if: runner.os == 'Linux'
        env:
          TALON_DEFAULT_ICE: ${{ secrets.TALON_DEFAULT_ICE }}
          TALON_DEFAULT_SFU_BASE: ${{ secrets.TALON_DEFAULT_SFU_BASE }}
          TALON_DEFAULT_SFU_GROUP: ${{ secrets.TALON_DEFAULT_SFU_GROUP }}
          TALON_DEFAULT_SFU_KEY: ${{ secrets.TALON_DEFAULT_SFU_KEY }}
        run: ./scripts/build-appimage.sh
      - name: Upload AppImage (Linux only)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/Talon-x86_64.AppImage
          if-no-files-found: error

  release:
    needs: [tagcheck, build-android, build-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifact tree
        run: |
          set -euo pipefail
          mkdir -p release-files
          # Use cp -n (no-clobber) so a future change that emits two
          # artifacts with the same basename (e.g. arm64 + amd64 .deb)
          # surfaces a collision rather than silently overwriting.
          collisions=0
          while IFS= read -r -d '' src; do
            dest="release-files/$(basename "$src")"
            if [ -e "$dest" ]; then
              echo "::error::Artifact name collision: $src would overwrite $dest"
              collisions=$((collisions + 1))
            else
              cp "$src" "$dest"
            fi
          done < <(find artifacts -type f \( \
            -name '*.apk' -o \
            -name '*.deb' -o \
            -name '*.dmg' -o \
            -name '*.msi' -o \
            -name '*.AppImage' -o \
            -name 'latest.json' \
          \) -print0)
          if [ "$collisions" -gt 0 ]; then
            echo "::error::$collisions artifact name collision(s) — refusing to publish"
            exit 1
          fi
          # Desktop matrix is configured to emit one .deb, one .dmg,
          # one .msi, and one .AppImage. Bail if any of those are
          # missing — they're not optional. APK + latest.json are
          # optional (only present when the keystore secret is set).
          # Check per extension: a bare total count can't tell four
          # .debs apart from one-of-each.
          missing=0
          for ext in deb dmg msi AppImage; do
            if ! find release-files -maxdepth 1 -type f -name "*.$ext" -print -quit | grep -q .; then
              echo "::error::Missing required desktop installer: no *.$ext in release-files/"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "::error::$missing required desktop installer kind(s) missing — refusing to publish"
            ls -la release-files/
            exit 1
          fi
          ls -la release-files/

      # The Android job wrote latest.json before any desktop installer
      # existed. Add each one's URL and hash now, so a desktop Talon
      # can fetch and verify the installer for the way it was installed
      # (AppImage swaps itself; deb / dmg / msi open in the system).
      - name: List desktop installers in latest.json
        run: |
          set -euo pipefail
          cd release-files
          if [ ! -f latest.json ]; then
            echo "no latest.json (no keystore); desktop keeps the browser fallback"
            exit 0
          fi
          BASE="https://github.com/nisfeb/talon/releases/download/${GITHUB_REF_NAME}"
          DESKTOP='{}'
          for pair in appimage:AppImage deb:deb dmg:dmg msi:msi; do
            kind="${pair%%:*}"; ext="${pair#*:}"
            # An unmatched glob stays literal, so matches[0] is
            # "*.$ext" when nothing exists — the -e test catches a
            # missing kind; the count test catches an ambiguous one.
            # (The flatten step already bails on a missing kind, but
            # this step must not die with a bare ls error or silently
            # pick an arbitrary file if run standalone.)
            matches=( *."$ext" )
            if [ ! -e "${matches[0]}" ]; then
              echo "::error::latest.json: no *.$ext installer present for desktop.$kind"
              exit 1
            fi
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "::error::latest.json: ${#matches[@]} *.$ext files — ambiguous which is desktop.$kind: ${matches[*]}"
              exit 1
            fi
            f="${matches[0]}"
            sha=$(sha256sum "$f" | awk '{print $1}')
            DESKTOP=$(jq --arg k "$kind" --arg url "$BASE/$f" --arg sha "$sha" \
              '.[$k] = {url: $url, sha256: $sha}' <<<"$DESKTOP")
          done
          jq --argjson desktop "$DESKTOP" '.desktop = $desktop' latest.json > latest.json.new
          mv latest.json.new latest.json
          cat latest.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
          # Tags like v0.8.0-rc1 / v1.0.0-beta2 publish as GitHub
          # pre-releases. The in-app updater hits releases/latest,
          # which excludes pre-releases — so existing stable users
          # don't get auto-prompted to install RC builds.
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
