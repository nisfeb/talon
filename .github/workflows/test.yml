name: test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Cancel an older run on the same branch when a new push lands —
# saves runner minutes and keeps the latest commit's status as the
# canonical answer.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # All unit tests now live under :composeApp — desktopTest covers
      # the parser / wire-format Tlon protocol regressions plus the
      # JSON-backed settings stores. Pure JVM, runs on ubuntu-latest.
      - name: Run unit tests
        run: ./gradlew :composeApp:desktopTest --stacktrace

      # The relay is on the call path now — a ring only wakes a sleeping
      # device if this module works. Its suite had never run in CI, and
      # a JDK-17 pin nobody had locally meant it never ran anywhere.
      - name: Relay tests
        run: ./gradlew :relay:test --stacktrace

      # Hook test runs the bash test harness that stages synthetic
      # content into throwaway git repos and asserts the pre-commit
      # rules (block / allow) match expectations. Catches both rule
      # regressions and exemption-path drift.
      - name: Run pre-commit hook tests
        run: ./scripts/hooks/test-pre-commit.sh

      # Upload JUnit XML reports on failure so the failing test names
      # are surfaced in the PR check view without having to dig into
      # raw build logs.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            composeApp/build/reports/tests/
            composeApp/build/test-results/
          if-no-files-found: ignore

  # iOS can only be verified on macOS — the Kotlin/Native Apple targets
  # don't compile on the Linux/JVM path, so the unit-tests job above
  # never touches iosMain. This job links the device framework
  # (iosArm64), which forces KSP plus all of commonMain + iosMain to
  # compile and link. It emits no shippable artifact (the .app is built
  # from Xcode), so it lives here as a per-PR compile gate rather than
  # in release.yml, which only runs at tag time and has nothing to
  # package for iOS. macos-latest bills at 10x runner minutes; a link
  # is a couple of them.
  ios-compile:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Archive via xcodebuild (unsigned), NOT a plain `gradlew linkRelease`.
      # This runs the exact path the TestFlight build uses — xcodebuild ->
      # the "Compile Kotlin Framework" run-script -> embedAndSign, with the
      # Kotlin compile in the Kotlin daemon — so a heap OOM there reproduces
      # here for free instead of costing a nomac build. Signing is disabled;
      # we only care that it compiles + archives.
      # Simulate a hostile builder (nomac/Codemagic) that pins a too-small
      # org.gradle.jvmargs in GRADLE_USER_HOME, outranking our project file.
      # The framework run-script must override this via its own
      # project-local GRADLE_USER_HOME, or the archive below OOMs.
      - name: Simulate a low builder heap default
        run: |
          mkdir -p "$HOME/.gradle"
          printf 'org.gradle.jvmargs=-Xmx2g\n' >> "$HOME/.gradle/gradle.properties"

      - name: Archive iOS app (unsigned, mirrors the TestFlight path)
        run: |
          set -o pipefail
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/Talon.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tail -500
