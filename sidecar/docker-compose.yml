# Trunkline sidecar — runs next to your ship (vere) on its host.
#
# NOTE: listeners do NOT use Galène's own web client. It hides
# audio-only publishers behind a "display all" setting and cannot
# autoplay in a tab nobody has clicked, so a plain group link is
# unusable to whoever you send it to. Serve sidecar/listen/index.html
# at /listen/ (see README) and %trunk mints links pointing there.
#
#   coturn  Tier 1 (STUN echo) + Tier 2 (TURN relay) for 1:1 calls
#   galene  the SFU that party lines run on
#
# Both are optional: without them Talon still makes Tier 0 calls (same
# LAN, public IPv6) — you just lose the hostile-NAT fallback and the
# ability to *host* a party line. One sidecar anywhere between two
# callers covers that call, so running one upgrades every call made
# to you.
#
# Bring up:
#   TURN_PASS=$(openssl rand -hex 16) docker compose up -d
# then advertise both from your ship (see README.md).
services:
  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    network_mode: host
    command:
      - --listening-port=3478
      - --fingerprint
      - --lt-cred-mech
      - --user=${TURN_USER:-talon}:${TURN_PASS:?set TURN_PASS}
      - --realm=trunkline
      - --no-cli
      - --no-tls
      - --no-dtls
      # Relay only what a call needs; keep the port range tight so
      # host firewalls can open it explicitly.
      - --min-port=49160
      - --max-port=49200

  # Party lines. ONE Galène group ("talon") is configured, with
  # auto-subgroups on: every room is a subgroup created on first join,
  # so opening a new party line needs no server-side change. %trunk
  # mints a per-room JWT signed with the group's authKeys secret.
  galene:
    image: galene:local
    build:
      # Pinned: building from a floating master means an SFU restart can
      # pick up whatever upstream landed that morning.
      context: https://github.com/jech/galene.git#galene-1.1
      dockerfile_inline: |
        FROM golang:1.24-alpine AS build
        WORKDIR /src
        COPY . .
        # handleAction dereferences c.group without a nil check, so a
        # member leaving a party line while a peer joins segfaults the
        # whole server — every room, not just theirs. Present in 1.1 and
        # master alike; drop this line once upstream guards it.
        RUN sed -i 's/if a\.group != c\.group\.Name() {/if c.group == nil || a.group != c.group.Name() {/' rtpconn/webclient.go
        RUN go build -o /galene
        FROM alpine:3
        COPY --from=build /galene /galene
        COPY --from=build /src/static /static
        ENTRYPOINT ["/galene", "-static", "/static"]
    restart: unless-stopped
    network_mode: host
    command: ["-insecure", "-http", ":8444", "-data", "/data", "-groups", "/groups"]
    volumes:
      - ./galene/data:/data
      - ./galene/groups:/groups
